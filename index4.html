<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>payment section</title>
    <link rel="stylesheet" href="style4.css">
</head>

<body>

    <section>

        <div class="section-left">
            <div id="check">CheckOut</div>
            <div id="Contact">Contact Details</div>
            <div id="e-mail">
                <label>E-mail ID</label>
                <br>
                <input type="e-mail" placeholder=E-mail>
            </div>

            <div id="pay">Payment</div>

            <div class="payment-section">
                <div class="payment">

                    <button class="pay-tab active">
                        <span class="icon icon-card"></span>
                        <span> card</span>
                    </button>


                    <button class="pay-tab">
                        <span class="icon icon-crypto"></span>
                        <span>Crypto</span>
                    </button>

                    <button class="pay-tab">
                        <span class="icon icon-bank"></span>
                        <span>Bank</span>
                    </button>

                    <button class="pay-tab pay -tab-more" arial-label="more payment methods">
                        <span class="icon icon-dots"></span>
                    </button>

                </div>

                <div id="card-number">
                    <label> Card Number</label>
                    <br>
                    <input type="number" placeholder="Card Number">
                </div>

                <div class="div1">
                    <div id="expiry">
                        <label>Expiry</label>
                        <br>
                        <input type="date" placeholder="MM/YY">
                    </div>


                    <div id="CVC">
                        <label>CVC</label>
                        <br>
                        <input type="text" placeholder="...">
                    </div>
                </div>
                <div class="div2">

                    <div id="Country">
                        <label>Country</label>
                        <br>
                        <input type="country" placeholder="India">
                    </div>

                    <div id="Zip">
                        <label>ZIP</label>
                        <br>
                        <input type="text" placeholder="XXXXXX">
                    </div>
                </div>




            </div>
        </div>
        <div id="section-right">

            <div id="order-summary">
                Order Summary
            </div>

            <div class="section-right">
                <div id="enter">
                    ENTER COUPON CODE
                </div>

                <div id="coupon">
                    <input type="number" placeholder="COUPON CODE">
                    <button><a href="#">Apply Coupon</a></button>
                </div>

                <div id="amount">
                    <label> Sub Total</label>
                    <label>₹6,031</label>
                </div>
                <div id="amount">
                    <label>Tax (It Applicable)</label>
                    <label>₹199</label>
                </div>
                <div id="amount">
                    <label>Discount</label>
                    <label>₹0</label>
                </div>
                <div id="amount" style="color: rgb(3, 67, 113)">
                    <label>Total</label>
                    <label>₹6,300</label>
                </div>

                <div id="paynow">
                    <button> <a href="#">Pay Now ₹6,300</a> </button>
                </div>


                <div id="pay-image">
                    <label>
                        <img src="OIP__2_-removebg-preview (2).png" alt="pay-image">
                    </label>
                    <label>
                        <img src="OIP__3_-removebg-preview (1).png" alt="pay-image">
                        </src>
                    </label>
                    <label>
                        <img src="OIP-removebg-preview (4).png" alt="pay-image">
                        </src>
                    </label>
                </div>

            </div>



        </div>

    </section>

</body>

</html>
